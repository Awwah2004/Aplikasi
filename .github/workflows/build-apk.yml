name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2)
          echo "Java version string: $JAVA_VER"
          if [[ "$JAVA_VER" =~ ^1\.([0-9]+) ]]; then
            MAJOR_VERSION="${BASH_REMATCH[1]}"
          else
            MAJOR_VERSION="${JAVA_VER%%.*}"
          fi
          echo "Detected major version: $MAJOR_VERSION"
          if [ -z "$MAJOR_VERSION" ]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java version is $MAJOR_VERSION, which is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating debug.keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore exists and verified."
          else
            echo "Error: Failed to create ./debug.keystore."
            exit 1
          fi

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ]; then
            echo "APK found: $EXPECTED_APK"
          else
            echo "Error: Expected APK not found at $EXPECTED_APK"
            echo "Searching inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist!"
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: $EXPECTED_APK does not have .apk extension."
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_NAME_RAW#*/}"
          REPO_NAME_CLEAN=$(echo "$REPO_NAME" | sed 's/[^a-zA-Z0-9_-]/_/g')
          TEMP_DIR=$(mktemp -d)
          NEW_APK_NAME="${REPO_NAME_CLEAN}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="$TEMP_DIR/$NEW_APK_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"
          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$NEW_APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking gh CLI version:"
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist at $ASSET_PATH"
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is empty"
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Asset does not have .apk extension"
            exit 1
          fi
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.

          - GitHub Actions Run Number: ${{ github.run_number }}
          - GitHub Actions Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}

          Please note:
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore.
          EOF
          )
          echo "Creating release with tag $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
            echo "Release URL: $RELEASE_URL"
            echo "### 🚀 APK Build and Release Successful!" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built successfully and published to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🔗 **[Download directly from the GitHub Release Page]($RELEASE_URL)**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Title:** \`Debug APK Build #${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Filename:** \`${{ steps.prepare_asset.outputs.asset_name }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "💡 You can download the APK from the **Assets** section of the release page above." >> "$GITHUB_STEP_SUMMARY"
            echo "📦 As a backup, the standard GitHub Actions build artifact named \`app-debug-apk\` is also available on this workflow run page." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "APK build was successful, and the Actions artifact remains available."
            echo "### ⚠️ APK Build Successful (Release Publishing Failed/Skipped)" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built successfully, but the automated GitHub Release publishing failed or was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📦 **Backup Download Option:**" >> "$GITHUB_STEP_SUMMARY"
            echo "The normal GitHub Actions build artifact named **\`app-debug-apk\`** is available on this workflow run page for manual download." >> "$GITHUB_STEP_SUMMARY"
          fi
